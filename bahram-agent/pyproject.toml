[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bahram"]

[project]
name = "bahram-agent"
version = "1.0.0"
description = "Bahram - Advanced self-improving AI agent inspired by Hermes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Bahram Team" }
]
keywords = ["ai", "agent", "llm", "automation", "hermes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "aiofiles>=23.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "tomli>=2.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "aiosqlite>=0.19.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=20.0"]
discord = ["discord.py>=2.0"]
slack = ["slack-bolt>=1.18.0"]
all = [
    "python-telegram-bot>=20.0",
    "discord.py>=2.0",
    "slack-bolt>=1.18.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
bahram = "bahram.cli:app"

[project.urls]
Homepage = "https://github.com/AnishtayiN/Bahram-Agent"
Documentation = "https://bahram-agent.readthedocs.io"
Repository = "https://github.com/AnishtayiN/Bahram-Agent"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
